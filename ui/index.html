<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="recipe-switch-token" content="__TOKEN__">
<meta name="color-scheme" content="light">
<title>recipe-switch</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="device">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 20" aria-hidden="true"><rect x="1" y="1" width="30" height="18" rx="9"/><circle cx="21" cy="10" r="6"/></svg>
      <div>
        <h1 class="wordmark">recipe-switch</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="langBtn" aria-label="language">EN</button>
      <button class="icon-btn" id="helpBtn" aria-label="help">?</button>
      <button class="icon-btn" id="refreshBtn" aria-label="refresh">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.7h-3.7"/></svg>
      </button>
    </div>
  </header>

  <main class="screens">
    <section class="screen is-active" id="screen-tools"></section>
    <section class="screen" id="screen-recipes"></section>
    <section class="screen" id="screen-sources"></section>
  </main>

  <nav class="dock" role="tablist">
    <button class="dock-item is-active" data-screen="tools" role="tab" aria-selected="true">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3.5" width="14" height="5" rx="2.5"/><rect x="3" y="11.5" width="14" height="5" rx="2.5"/><circle cx="14.5" cy="6" r="1.4"/><circle cx="5.5" cy="14" r="1.4"/></svg>
      <span data-i18n="navTools"></span>
    </button>
    <button class="dock-item" data-screen="recipes" role="tab" aria-selected="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h7.5L16 6.5V17H5z"/><path d="M8 9.5h5M8 12.5h5M8 15h3"/></svg>
      <span data-i18n="navRecipes"></span>
    </button>
    <button class="dock-item" data-screen="sources" role="tab" aria-selected="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7h5l1.5 2H17v7H3z"/><path d="M3 7V4.5h5L9.5 6.5"/></svg>
      <span data-i18n="navSources"></span>
    </button>
  </nav>

  <div id="sheetMount"></div>
  <div id="toastMount" class="toast-mount" role="status" aria-live="polite"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
